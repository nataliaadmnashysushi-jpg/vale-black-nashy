<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Validar Vale Black · Unidades</title>
<link rel="icon" href="assets/img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>.balance .card b{white-space:normal;font-size:clamp(12px,3.8vw,16px)}.balance .card{min-width:0;padding:10px}</style>
</head>
<body>
<main class="view">
  <form class="stack" id="login" hidden>
    <img class="brand" src="assets/img/logo.jpg" alt="Nashy Sushi" style="width:140px">
    <span class="eyebrow">Acesso da unidade</span>
    <h2>Validar Vale Black</h2>
    <div class="field"><label for="l-unid">Unidade</label><select id="l-unid"><option>Savassi</option><option>Lourdes</option><option>São Pedro</option><option>Contagem</option></select></div>
    <div class="field"><label for="l-pass">Senha da unidade</label><input id="l-pass" type="password" autocomplete="current-password" required></div>
    <p class="err" id="loginErr" hidden></p>
    <button class="btn" type="submit">Entrar</button>
  </form>

  <div class="stack" id="main" hidden>
    <div class="row"><div><span class="eyebrow" id="unitName"></span><div class="muted tiny" id="today"></div></div>
      <button class="btn sm ghost" type="button" id="logout">Sair</button></div>
    <div class="field"><label for="att">Seu nome (atendente)</label><input id="att" autocomplete="off"></div>
    <div class="row" style="gap:8px">
      <input class="input" id="code" aria-label="Código do vale" placeholder="NSH-XXXXX" autocomplete="off" style="flex:1;min-width:0;text-transform:uppercase">
      <button class="btn sm" type="button" id="find" style="padding:13px 16px">Buscar</button>
    </div>
    <button class="btn ghost" type="button" id="scan">Ler QR code</button>
    <div id="reader" hidden></div>
    <div id="result" class="stack"></div>
    <details id="dayBox" style="margin-top:12px"><summary>Fechamento: vales usados hoje nesta unidade</summary><div id="dayList" class="stack" style="margin-top:8px"></div></details>
  </div>
</main>
<script src="assets/vendor/supabase-2.117.3.js"></script>
<script src="assets/vendor/html5-qrcode-2.3.8.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/common.js"></script>
<script>
let me = null, scanner = null;
const store = { get:k=>{try{return localStorage.getItem(k)}catch{return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}} };

async function loadDay(){
  const box = $("#dayList"); if (!box) return;
  try {
    const list = await rpc("unit_today");
    if (!list.length) { box.innerHTML = '<p class="muted small">Nenhum vale usado hoje.</p>'; return; }
    const tot = list.reduce((a,u)=>a+Number(u.valor)+(u.bonus?50:0),0);
    box.innerHTML = `<p class="small">${list.length} uso(s) · total ${fmt(tot)} (vales + bônus)</p><div class="hist">${list.map(u=>`<div><span class="num muted">${esc(u.hora)}</span><span>${esc(u.code)} · comanda ${esc(u.comanda)} · ${[Number(u.valor)>0?"Vale "+fmt(u.valor):"", u.cortesia?"cortesia "+esc(u.cortesia):"", u.bonus?"Bônus R$ 50,00":""].filter(Boolean).join(" + ")}</span><span class="muted">${esc(u.atendente)}</span></div>`).join("")}</div><p class="muted tiny">Confira no fechamento: cada comanda desta lista precisa ter o desconto do vale lançado no caixa.</p>`;
  } catch(e) { box.innerHTML = `<p class="muted small">${esc(errMsg(e))}</p>`; }
}
$("#dayBox").addEventListener("toggle", e => { if (e.target.open) loadDay(); });

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) { $("#login").hidden = false; $("#main").hidden = true; return; }
  const { data } = await sb.from("profiles").select("role,unit_name").eq("user_id", session.user.id).maybeSingle();
  if (!data) { await sb.auth.signOut(); $("#login").hidden = false; return; }
  me = data;
  $("#unitName").textContent = data.unit_name || "Admin";
  $("#today").textContent = new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"2-digit"});
  $("#att").value = store.get("atendente") || "";
  $("#login").hidden = true; $("#main").hidden = false;
}
$("#login").addEventListener("submit", async e => {
  e.preventDefault(); const err = $("#loginErr"); err.hidden = true;
  const { error } = await sb.auth.signInWithPassword({ email: CFG.UNIT_EMAILS[$("#l-unid").value], password: $("#l-pass").value });
  if (error) { err.textContent = errMsg(error); err.hidden = false; return; }
  $("#l-pass").value = ""; boot();
});
$("#logout").onclick = async () => { await sb.auth.signOut(); $("#result").innerHTML = ""; boot(); };
$("#att").addEventListener("change", e => store.set("atendente", e.target.value.trim()));
$("#find").onclick = () => findVoucher($("#code").value);
$("#code").addEventListener("keydown", e => { if (e.key === "Enter") findVoucher($("#code").value); });

$("#scan").onclick = async () => {
  const box = $("#reader");
  if (scanner) { await scanner.stop().catch(()=>{}); scanner = null; box.hidden = true; $("#scan").textContent = "Ler QR code"; return; }
  box.hidden = false; $("#scan").textContent = "Fechar câmera";
  scanner = new Html5Qrcode("reader");
  try {
    await scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 220 }, async text => {
      await scanner.stop().catch(()=>{}); scanner = null; box.hidden = true; $("#scan").textContent = "Ler QR code";
      $("#code").value = text.trim(); findVoucher(text);
    });
  } catch { toast("Não foi possível abrir a câmera. Libere a câmera para este site ou digite o código."); box.hidden = true; scanner = null; $("#scan").textContent = "Ler QR code"; }
};

// Aceita "NSH-AB3CD", "nsh ab3cd", "NSHAB3CD", "AB3CD" e espaços ou traços no meio
function normCode(t){
  let x = String(t||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if (x.startsWith("NSH") && x.length === 8) x = x.slice(3);
  return x.length === 5 ? "NSH-" + x : String(t||"").trim().toUpperCase();
}
async function findVoucher(code){
  const out = $("#result"); code = normCode(code);
  if (!code) return toast("Digite o código do vale.");
  out.innerHTML = '<p class="muted">Buscando…</p>';
  let v;
  try { v = await rpc("find_voucher", { p_code: code }); } catch(e) { out.innerHTML = `<p class="err">${esc(errMsg(e))}</p>`; return; }
  if (!v) { out.innerHTML = `<div class="card"><span class="pill red">Não encontrado</span><p class="muted" style="margin-top:8px">Confira o código. Se o cliente tiver só um print, peça o link do vale que ele recebeu no WhatsApp.</p></div>`; return; }
  render(v);
}

let currentCode = "";
function render(v){
  currentCode = v.code;
  const out = $("#result");
  const cancelled = v.status !== "ativo";
  const valeOff = cancelled || v.vencido || v.saldo <= 0 || !!v.vale_bloqueio;
  const valeWhy = cancelled ? "Vale cancelado" : v.vencido ? "Vale vencido" : v.saldo <= 0 ? "Sem saldo" : v.vale_bloqueio || ("Saldo " + fmt(v.saldo));
  const cortOff = valeOff || v.cortesia_usada;
  const bonusOff = !!v.bonus_bloqueio;
  const pill = cancelled ? '<span class="pill red">Cancelado</span>' : v.vencido ? '<span class="pill red">Vencido</span>' : `<span class="pill ok">Válido até ${brDate(v.expires_on)}</span>`;
  out.innerHTML = `
  <div class="card stack">
    <div class="row"><div><b class="num" style="font-weight:500;white-space:nowrap">${esc(v.code)}</b><div class="muted small">${esc(v.nome)}</div></div>${pill}</div>
    <div class="balance">
      <div class="card"><span>Saldo do vale</span><b class="num">${fmt(v.saldo)}</b></div>
      <div class="card"><span>Cortesia</span><b>${v.cortesia_usada ? "Usada" : "Livre"}</b></div>
      <div class="card"><span>Bônus R$ 50</span><b>${v.bonus_usado ? "Usado" : bonusOff ? "Bloqueado" : "Livre"}</b></div>
    </div>
  </div>
  <form id="use" class="stack">
    <span class="eyebrow">O que o cliente vai usar agora</span>
    <div class="choice">
      <label class="opt ${valeOff?"off":""}"><input type="checkbox" id="c-vale" ${valeOff?"disabled":""}><div><b style="font-weight:500">Crédito do vale</b><div class="muted small">${esc(valeWhy)}</div>
        <div class="sub" id="valeSub" hidden><p class="small" id="calc">O sistema desconta do vale o valor da conta, até o saldo.</p></div></div></label>
      <label class="opt ${cortOff?"off":""}"><input type="checkbox" id="c-cort" ${cortOff?"disabled":""}><div><b style="font-weight:500">Cortesia</b><div class="muted small">${v.cortesia_usada ? "Já usada: " + esc(v.cortesia_item) : "Qualquer drink ou sobremesa do cardápio, só junto com o crédito do vale. Não vale com desconto de aniversário."}</div>
        <div class="sub" id="cortSub" hidden>
          <div class="seg"><label><input type="radio" name="ctipo" value="Drink" checked>Drink</label><label><input type="radio" name="ctipo" value="Sobremesa">Sobremesa</label></div>
          <div class="field"><label for="c-item">Qual item do cardápio</label><input id="c-item" autocomplete="off" placeholder="Ex.: nome do drink ou da sobremesa"></div></div></div></label>
      <label class="opt ${bonusOff?"off":""}"><input type="checkbox" id="c-bonus" ${bonusOff?"disabled":""}><div><b style="font-weight:500">Bônus R$ 50</b><div class="muted small">${esc(v.bonus_bloqueio || "Só em mesa de rodízio, um bônus por rodízio. Uso único: a diferença não fica guardada.")}</div></div></label>
    </div>
    <div class="field"><label for="c-conta">Valor total da comanda (com serviço)</label><input id="c-conta" inputmode="decimal" autocomplete="off" placeholder="0,00"><span class="muted tiny">Mais de um vale na mesma comanda? No segundo vale, digite só o que ainda falta pagar.</span></div>
    <div class="field"><label for="c-com">Número da comanda</label><input id="c-com" inputmode="numeric" autocomplete="off"></div>
    <button class="btn" type="submit">Revisar e confirmar</button>
  </form>
  <div id="confirm"></div>
  ${v.historico.length ? `<div class="stack"><span class="eyebrow">Histórico deste vale</span><div class="hist">${v.historico.map(h=>`<div><span class="num muted">${esc(h.quando)}</span><span>${[h.valor>0?"Vale "+fmt(h.valor):"", h.cortesia?"cortesia "+esc(h.cortesia):"", h.bonus?"Bônus R$ 50,00":""].filter(Boolean).join(" + ")}</span><span class="muted">${esc(h.unidade)}${h.pode_desfazer ? ` <button class="btn sm ghost" type="button" data-undo="${h.id}">Desfazer</button>` : ""}</span></div>`).join("")}</div><p class="muted tiny">Registrou errado? Dá para desfazer em até 30 minutos. Depois disso, fale com a Natália.</p></div>` : ""}`;

  const cv=$("#c-vale"), cc=$("#c-cort"), cb=$("#c-bonus");
  const sync = () => { $("#valeSub").hidden = !cv.checked; $("#cortSub").hidden = !cc.checked; };
  cv.addEventListener("change", () => { if (cv.checked) cb.checked = false; else cc.checked = false; sync(); });
  cc.addEventListener("change", () => { if (cc.checked) { cv.checked = true; cb.checked = false; } sync(); });
  cb.addEventListener("change", () => { if (cb.checked && (cv.checked || cc.checked)) { toast("O bônus não entra na mesma comanda do vale."); cb.checked = false; } });
  $("#c-conta").addEventListener("input", () => { const t = parseMoney($("#c-conta").value);
    $("#calc").textContent = t > 0 ? `Vale paga ${fmt(Math.min(t, v.saldo))} · cliente paga ${fmt(Math.max(t - v.saldo, 0))} · saldo fica ${fmt(Math.max(v.saldo - t, 0))}` : "O sistema desconta do vale o valor da conta, até o saldo."; });
  $("#use").addEventListener("submit", e => { e.preventDefault(); review(v); });
}

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-undo]"); if (!b) return;
  if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Tocar de novo para desfazer"; return; }
  b.disabled = true;
  try { await rpc("undo_redemption", { p_id: Number(b.dataset.undo) }); toast("Registro desfeito."); findVoucher(currentCode); }
  catch(ex) { toast(errMsg(ex)); b.disabled = false; }
});

function review(v){
  const cv=$("#c-vale").checked, cc=$("#c-cort").checked, cb=$("#c-bonus").checked;
  const com=$("#c-com").value.trim(), att=$("#att").value.trim();
  const conta = parseMoney($("#c-conta").value);
  const val = Math.min(conta, Number(v.saldo));
  if (att.length < 2) return toast("Escreva o seu nome no topo antes de confirmar.");
  if (!cv && !cb) return toast("Marque o que o cliente vai usar.");
  if (conta <= 0) return toast("Digite o valor total da comanda.");
  if (conta > 5000) return toast("Confira o valor da comanda: " + fmt(conta) + ".");
  if (!com) return toast("Digite o número da comanda.");
  store.set("atendente", att);
  const tipo = cc ? document.querySelector('input[name="ctipo"]:checked').value : null, item = cc ? $("#c-item").value.trim() : null;
  if (cc && item.length < 2) return toast("Escreva qual drink ou sobremesa o cliente escolheu.");
  const parts = []; if (cv) parts.push("Vale " + fmt(val)); if (cc) parts.push("cortesia " + item); if (cb) parts.push("Bônus R$ 50,00");
  $("#confirm").innerHTML = `<div class="card confirm stack"><b style="font-weight:500">Confirmar no vale ${esc(v.code)}?</b>
    <p>${esc(parts.join(" + "))}</p>
    <p class="small">Conta ${fmt(conta)}${cv ? ` · cliente paga ${fmt(Math.max(conta - val, 0))} · saldo do vale fica ${fmt(Number(v.saldo) - val)}` : ""}${cb ? ` · cliente paga ${fmt(Math.max(conta - 50, 0))}` : ""}</p>
    ${cb && conta < 50 ? `<p class="err">A conta é menor que R$ 50. A diferença do bônus não fica guardada. Avise o cliente antes de confirmar.</p>` : ""}
    <p class="muted small">Comanda ${esc(com)} · ${esc(att)} · cliente ${esc(v.nome)}</p>
    <div class="row" style="justify-content:flex-start"><button class="btn ok" type="button" id="yes">Confirmar</button><button class="btn ghost" type="button" id="no">Corrigir</button></div></div>`;
  $("#confirm").scrollIntoView({ behavior:"smooth", block:"center" });
  $("#no").onclick = () => $("#confirm").innerHTML = "";
  $("#yes").onclick = async () => {
    $("#yes").disabled = true;
    try {
      const nv = await rpc("redeem", { p_code:v.code, p_valor: cv ? val : 0, p_cort_tipo: tipo, p_cort_item: item, p_bonus: cb, p_comanda: com, p_atendente: att });
      toast("Registrado. Saldo do vale: " + fmt(nv.saldo)); render(nv); window.scrollTo(0,0);
    } catch(e) { toast(errMsg(e)); $("#yes").disabled = false; }
  };
}
boot();
</script>
</body>
</html>
